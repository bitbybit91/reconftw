#############################################
#	reconFTW Hidden Services config file	#
#############################################

# General values
tools=$HOME/Tools   # Path installed tools
SCRIPTPATH="$( cd "$(dirname "$0")" >/dev/null 2>&1 ; pwd -P )" # Get current script's path
profile_shell=".$(basename $(echo $SHELL))rc" # Get current shell profile
reconftw_version=$(git rev-parse --abbrev-ref HEAD)-$(git describe --tags)-HS # Fetch current reconftw version
generate_resolvers=false # Generate custom resolvers with dnsvalidator
update_resolvers=false # Don't fetch resolvers for hidden services
install_golang=true # Set it to false if you already have Golang configured and ready
upgrade_tools=true
upgrade_before_running=false # Upgrade tools before running
#dir_output=/custom/output/path

# Hidden Services Specific Configuration
HIDDEN_SERVICES_MODE=true # Enable hidden services mode
TOR_ENABLED=true # Enable Tor proxy
TOR_PROXY="socks5://127.0.0.1:9050" # Tor SOCKS5 proxy
TOR_HTTP_PROXY="http://127.0.0.1:8118" # Tor HTTP proxy (Privoxy)
TOR_CONTROL_PORT=9051 # Tor control port
TOR_PASSWORD="" # Tor control password (optional)
ONION_VALIDATION=true # Validate .onion domains
CIRCUIT_ROTATION_INTERVAL=300 # Rotate Tor circuits every N seconds
HARDENING_BYPASS=true # Enable system hardening bypass techniques
STEALTH_MODE=true # Enable stealth scanning mode
MAX_RETRIES=5 # Maximum retries for failed requests
REQUEST_TIMEOUT=120 # Timeout for requests in seconds (longer for .onion)
RATE_LIMIT_DELAY=2 # Delay between requests in seconds

# Golang Vars (Comment or change on your own)
export GOROOT=/usr/local/go
export GOPATH=$HOME/go
export PATH=$GOPATH/bin:$GOROOT/bin:$HOME/.local/bin:$PATH

# Rust Vars (Comment or change on your own)
export PATH="$HOME/.cargo/bin:$PATH"

# Tools config files
GITHUB_TOKENS=${tools}/.github_tokens
GITLAB_TOKENS=${tools}/.gitlab_tokens

# APIs/TOKENS - Limited for hidden services
# Most external APIs won't work with .onion domains
#XSS_SERVER="XXXXXXXXXXXXXXXXX"
#COLLAB_SERVER="XXXXXXXXXXXXXXXXX"

# File descriptors
DEBUG_STD="&>/dev/null" # Skips STD output on installer
DEBUG_ERROR="2>/dev/null" # Skips ERR output on installer

# Osint - Modified for hidden services
OSINT=true # Enable or disable the whole OSINT module
GOOGLE_DORKS=false # Not applicable for .onion
GITHUB_DORKS=false # Not applicable for .onion
GITHUB_REPOS=false # Not applicable for .onion
METADATA=true # Fetch metadata from indexed documents
EMAILS=true # Fetch emails
DOMAIN_INFO=false # whois not applicable for .onion
IP_INFO=false # Not applicable for .onion
API_LEAKS=false # Not applicable for .onion
THIRD_PARTIES=false # Not applicable for .onion
SPOOF=false # Not applicable for .onion
METAFINDER_LIMIT=20

# Subdomains - Modified for hidden services
SUBDOMAINS_GENERAL=false # .onion sites don't use traditional subdomains
SUBPASSIVE=false
SUBCRT=false
SUBNOERROR=false
SUBANALYTICS=false
SUBBRUTE=false # Could be useful for discovering sub-pages
SUBSCRAPING=true # Web crawling is useful
SUBPERMUTE=false
SUBIAPERMUTE=false
SUBREGEXPERMUTE=false
SUBTAKEOVER=false
SUB_RECURSIVE_PASSIVE=false
SUB_RECURSIVE_BRUTE=false
ZONETRANSFER=false
S3BUCKETS=false
REVERSE_IP=false
INSCOPE=false

# Web detection - Critical for hidden services
WEBPROBESIMPLE=true # Web probing
WEBPROBEFULL=false # Limited port scanning for .onion
WEBSCREENSHOT=true # Webs screenshooting
VIRTUALHOSTS=false
UNCOMMON_PORTS_WEB="80,8080,8000,3000,5000,9000" # Common .onion ports

# Host
FAVICON=true
PORTSCANNER=false # Limited port scanning for .onion
GEO_INFO=false # Not applicable
PORTSCAN_PASSIVE=false
PORTSCAN_ACTIVE=false
CDN_IP=false

# Web analysis - Core functionality for hidden services
WAF_DETECTION=true
NUCLEICHECK=true
NUCLEI_TEMPLATES_PATH="$HOME/nuclei-templates"
NUCLEI_SEVERITY="info,low,medium,high,critical"
NUCLEI_EXTRA_ARGS=""
NUCLEI_FLAGS="-silent -retries 3 -timeout 120" # Longer timeout for .onion
NUCLEI_FLAGS_JS="-silent -tags exposure,token -severity info,low,medium,high,critical"
URL_CHECK=true
URL_CHECK_PASSIVE=false # No passive sources for .onion
URL_CHECK_ACTIVE=true # Crawling is the main method
URL_GF=true
URL_EXT=true
JSCHECKS=true
FUZZ=true
IIS_SHORTNAME=false
CMS_SCANNER=true
WORDLIST=true
ROBOTSWORDLIST=false
PASSWORD_DICT=true
PASSWORD_MIN_LENGTH=5
PASSWORD_MAX_LENGTH=14
CLOUDHUNTER_PERMUTATION=NONE
NUCLEI_FUZZING_TEMPLATES_PATH="${tools}/fuzzing-templates"

# Vulns - Enhanced for hidden services
VULNS_GENERAL=true
XSS=true
CORS=true
TEST_SSL=false # .onion uses different SSL/TLS
OPEN_REDIRECT=true
SSRF_CHECKS=true
CRLF_CHECKS=true
LFI=true
SSTI=true
SQLI=true
SQLMAP=true
GHAURI=true
BROKENLINKS=true
SPRAY=true # Password spraying
COMM_INJ=true
PROTO_POLLUTION=true
SMUGGLING=true
WEBCACHE=true
BYPASSER4XX=true
FUZZPARAMS=true

# Brute force settings (from 1N3/Brute integration)
BRUTE_ENABLED=true
BRUTE_WORDLIST="${tools}/wordlists/passwords.txt"
BRUTE_USERLIST="${tools}/wordlists/users.txt"
BRUTE_THREADS=10
BRUTE_DELAY=1

# scan4all integration settings
SCAN4ALL_ENABLED=true
SCAN4ALL_DEEP=true
SCAN4ALL_POC=true

# Extra features
NOTIFICATION=false
SOFT_NOTIFICATION=false
DEEP=true # DEEP mode for thorough scanning
DEEP_LIMIT=1000
DEEP_LIMIT2=3000
DIFF=false
REMOVETMP=true
REMOVELOG=false
PROXY=true # Use proxy
SENDZIPNOTIFY=false
PRESERVE=true
FFUF_FLAGS=" -mc all -fc 404 -sf -noninteractive -of json -timeout 120" # Longer timeout
HTTPX_FLAGS=" -follow-redirects -random-agent -status-code -silent -title -web-server -tech-detect -location -content-length -timeout 120" # Longer timeout

# HTTP options - Tor-aware
HEADER="User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:91.0) Gecko/20100101 Firefox/91.0" # Generic Tor Browser user agent

# Threads - Conservative for .onion
FFUF_THREADS=10
HTTPX_THREADS=10
HTTPX_UNCOMMONPORTS_THREADS=10
KATANA_THREADS=5
BRUTESPRAY_THREADS=5
BRUTESPRAY_CONCURRENCE=5
DNSTAKE_THREADS=10
DALFOX_THREADS=10
PUREDNS_PUBLIC_LIMIT=0
PUREDNS_TRUSTED_LIMIT=400
PUREDNS_WILDCARDTEST_LIMIT=30
PUREDNS_WILDCARDBATCH_LIMIT=1500000
RESOLVE_DOMAINS_THREADS=10
DNSVALIDATOR_THREADS=50
INTERLACE_THREADS=5
TLSX_THREADS=10
XNLINKFINDER_DEPTH=5 # Deeper crawling for .onion

# Rate limits - Conservative for .onion
HTTPX_RATELIMIT=10
NUCLEI_RATELIMIT=10
FFUF_RATELIMIT=10

# Timeouts - Longer for .onion
SUBFINDER_ENUM_TIMEOUT=180
CMSSCAN_TIMEOUT=7200 # 2 hours
FFUF_MAXTIME=1800 # 30 minutes
HTTPX_TIMEOUT=120 # 2 minutes
HTTPX_UNCOMMONPORTS_TIMEOUT=120

# lists
fuzz_wordlist=${tools}/fuzz_wordlist.txt
lfi_wordlist=${tools}/lfi_wordlist.txt
ssti_wordlist=${tools}/ssti_wordlist.txt
subs_wordlist=${tools}/subdomains.txt
subs_wordlist_big=${tools}/subdomains_n0kovo_big.txt
resolvers=${tools}/resolvers.txt
resolvers_trusted=${tools}/resolvers_trusted.txt

# Axiom Fleet - Disabled for hidden services
AXIOM=false
AXIOM_FLEET_LAUNCH=false
AXIOM_FLEET_NAME="reconFTW"
AXIOM_FLEET_COUNT=10
AXIOM_FLEET_REGIONS="eu-central"
AXIOM_FLEET_SHUTDOWN=true
AXIOM_EXTRA_ARGS=""

# Faraday-Server
FARADAY=false
FARADAY_SERVER="http://localhost:5985"
FARADAY_USER="faraday"
FARADAY_PASS="FARADAY_PASSWORD"
FARADAY_WORKSPACE="reconftw"

# AI
AI_MODEL="llama3:8b"
AI_REPORT_TYPE="md"
AI_REPORT_PROFILE="bughunter"

# TERM COLORS
bred='\033[1;31m'
bblue='\033[1;34m'
bgreen='\033[1;32m'
byellow='\033[1;33m'
red='\033[0;31m'
blue='\033[0;34m'
green='\033[0;32m'
yellow='\033[0;33m'
reset='\033[0m'
